apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-alertmanager-pipeline
data:
  config.alloy: |
    prometheus.alertmanager.receive "source" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 9095
      }
      forward_to = [prometheus.alertmanager.write.destination.receiver]
    }

    prometheus.alertmanager.write "destination" {
      endpoint {
        url        = "http://alertmanager:9093"
        batch_size = 1
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-alertmanager-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy-alertmanager-pipeline
  template:
    metadata:
      labels:
        app: alloy-alertmanager-pipeline
    spec:
      containers:
        - name: alloy
          image: alloy-alertmanager-pipeline:latest
          args:
            - run
            - --feature.community-components.enabled
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - name: webhook
              containerPort: 9095
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-alertmanager-pipeline
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy-alertmanager-pipeline
spec:
  selector:
    app: alloy-alertmanager-pipeline
  ports:
    - name: webhook
      port: 9095
      targetPort: webhook
